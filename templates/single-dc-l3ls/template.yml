---
name: single-dc-l3ls
title: Single DC L3LS (EVPN/VXLAN, 2 spines, 2 MLAG leaf pairs, 2 L2 leafs)
description: >
  eBGP underlay + eBGP EVPN overlay with VXLAN, spines as route servers, MLAG L3 leaf pairs and one L2 leaf per
  pair. Fully generated from the knobs below (counts, pools, ASNs, mgmt subnet, tenants, servers).
  Based on the AVD example `single-dc-l3ls`.
tags: [l3ls, evpn, vxlan, mlag, ebgp]
learn: >
  Teaches the reference AVD design end to end: node types spine / l3leaf / l2leaf, node ids and the IP math behind
  loopback, VTEP, P2P uplink and MLAG pools (`loopback_ipv4_offset`, `uplink_ipv4_pool`, `max_uplink_switches`),
  eBGP underlay with one ASN per leaf pair, eBGP EVPN overlay with the spines as route servers, MLAG pairs with the
  shared VTEP, tenants → VRFs (`vrf_vni`) → SVIs (`ip_address_virtual`) → L2VNIs (`mac_vrf_vni_base`), and
  connected endpoints with MLAG port-channels. Every count and pool is a knob, so you can change the fabric size and
  watch the configs, the topology and the ANTA catalogs follow.
  AVD doc: https://avd.arista.com/6.4/ansible_collections/arista/avd/examples/single-dc-l3ls/index.html
fabric_name: FABRIC
generator: l3ls
base_mgmt_subnet: 172.16.1.0/24
l3ls:
  fabric_group: FABRIC
  dc_group: "{DC}"
  spines_group: "{DC}_SPINES"
  l3leaves_group: "{DC}_L3_LEAVES"
  l2leaves_group: "{DC}_L2_LEAVES"
  services_group: NETWORK_SERVICES
  endpoints_group: CONNECTED_ENDPOINTS
  l3_node_group_prefix: "{DC}_L3_LEAF"
  l2_node_group_prefix: "{DC}_L2_LEAF"
  mgmt_offsets: {spine: 10, l3leaf: 100, l2leaf: 150}
  l2leaf_mlag_peer_pool: 10.255.2.64/27
knobs:
  - key: dc_name
    type: string
    default: dc1
    label: DC name / hostname prefix
    help: Hostnames become <dc>-spine<n>, <dc>-leaf<n>a/b (L3 MLAG pair) and <dc>-leaf<n>c/d (L2 leafs). Groups use upper(dc).
    learn:
      summary: Name of the data centre. It prefixes every hostname (dc1-spine1, dc1-leaf1a …) and, upper-cased, the inventory groups (DC1,
        DC1_SPINES, DC1_L3_LEAVES …).
      avd_keys:
      - <node_type>.nodes[].name
      - <node_type>.node_groups[].group
      - <node_type>.node_groups[].nodes[].name
      renders: hostname dc1-leaf1a; mlag configuration / domain-id DC1_L3_LEAF1; descriptions such as P2P_dc1-spine1_Ethernet1
      pitfalls:
      - AVD finds a device by its inventory hostname, so node `name` and inventory hostname must match — the generator keeps them in sync,
        a hand edit must too.
      - Renaming the DC renames every device: a deployed lab needs a redeploy, and CloudVision sees new devices.
      doc_url: https://avd.arista.com/6.4/ansible_collections/arista/avd/roles/eos_designs/docs/tables/node-type-structure.html
  - key: mgmt_subnet
    type: cidr
    default: 172.16.1.0/24
    label: Management subnet
    help: "Also used as the containerlab management network. Spines get .11+, L3 leafs .101+, L2 leafs .151+."
    learn:
      summary: Out-of-band management subnet. The l3ls generator numbers `mgmt_ip` from it — spines .11+, L3 leafs .101+, L2 leafs .151+
        — and uses it as the containerlab management network.
      avd_keys:
      - <node_type>.nodes[].mgmt_ip
      - <node_type>.node_groups[].nodes[].mgmt_ip
      renders: interface Management1 / vrf MGMT / ip address 172.16.1.101/24
      pitfalls:
      - Must not overlap the host's own networks or another lab's management network on the same host.
      - The gateway (mgmt_gateway) must be inside this subnet.
      doc_url: https://avd.arista.com/6.4/ansible_collections/arista/avd/roles/eos_designs/docs/tables/node-type-common-configuration.html
  - key: mgmt_gateway
    type: ipv4
    default: 172.16.1.1
    label: Management gateway
    learn:
      summary: Default gateway of the management VRF. AVD renders a static default route in VRF MGMT towards it.
      avd_keys:
      - mgmt_gateway
      renders: ip route vrf MGMT 0.0.0.0/0 172.16.1.1
      pitfalls:
      - Must be an address inside mgmt_subnet; on containerlab it is the management bridge's gateway.
      - A node-level `mgmt_gateway` overrides the global one.
      doc_url: https://avd.arista.com/6.4/ansible_collections/arista/avd/roles/eos_designs/docs/tables/management-interface-settings.html
  - key: ceos_version
    type: string
    default: 4.34.2F
    label: cEOS-lab version
    help: Docker image arista/ceos:<version> used in the containerlab topology.
    learn:
      summary: cEOS-lab image version for the containerlab topology (image arista/ceos:<version>). It does not change the AVD data model
        — the same intended configs run on any recent EOS.
      avd_keys: []
      renders: 'Nothing in the EOS config; `image: arista/ceos:4.34.2F` in clab/topology.clab.yml'
      pitfalls:
      - The image must exist on the lab host (Images page → download / push).
      - Very old EOS versions may reject CLI that AVD 6.4 renders (AVD targets current EOS syntax, EOS 4.35 ordering).
      doc_url: https://containerlab.dev/manual/kinds/ceos/
  - key: ceos_arch
    type: string
    default: x86_64
    choices: [x86_64, arm64]
    label: cEOS architecture
    help: "x86_64 → arista/ceos:<version> (cEOS/cEOS64), arm64 → arista/ceos:<version>-arm64 (cEOSarm). Must match the host CPU."
    learn:
      summary: CPU architecture of the cEOS image — x86_64 (arista/ceos:<version>) or arm64 (arista/ceos:<version>-arm64, cEOSarm). Must
        match the lab host.
      avd_keys: []
      renders: Nothing in the EOS config; selects the image tag in the containerlab topology
      pitfalls:
      - An x86_64 image on an ARM host (or vice versa) will not boot.
      doc_url: https://containerlab.dev/manual/kinds/ceos/
  - key: device_password
    type: secret
    default: arista
    label: Device password
    help: Password of the `arista` local user (sha512) and of all BGP peer groups (type-7). ansible_password follows.
    learn:
      summary: Password of the `arista` admin user on every switch (hashed to sha512) and of the BGP peer groups (type-7, encrypted per
        peer-group name). Ansible and ANTA log in with it.
      avd_keys:
      - aaa_settings.local_users[name=arista].sha512_password
      - bgp_peer_groups.<peer group>.password
      - ansible_password
      renders: username arista privilege 15 role network-admin secret sha512 $6$…; neighbor EVPN-OVERLAY-PEERS password 7 …
      pitfalls:
      - The type-7 BGP password is keyed on the peer-group NAME — renaming a peer group invalidates a pre-encrypted password (use cleartext_password
        instead).
      - Changing it on a deployed lab requires a deploy; until then Ansible/ANTA use the new password against the old config and fail to
        log in.
      doc_url: https://avd.arista.com/6.4/ansible_collections/arista/avd/roles/eos_designs/docs/tables/aaa-settings.html
  - key: spine_count
    type: int
    default: 2
    min: 1
    max: 4
    label: Spines
    help: "With more than 2 spines the leaf uplinks use Ethernet1-4 and the MLAG peer-link Ethernet5-6; server ports on Ethernet3-6 are shifted up automatically (Ethernet5 -> Ethernet7)."
    learn:
      summary: Number of spines. Every L3 leaf gets one uplink per spine (uplink_switches), each spine is an EVPN route server for all leafs.
      avd_keys:
      - spine.nodes
      - l3leaf.defaults.uplink_switches
      - l3leaf.defaults.loopback_ipv4_offset
      - default_interfaces
      renders: 'interface Ethernet1..N (P2P_dc1-spineN_…) on each leaf; one EVPN neighbor per spine; spine Loopback0 = pool #1..N'
      pitfalls:
      - loopback_ipv4_offset of the leafs follows the spine count (spines use Loopback0
      - The P2P /31 formula uses max_uplink_switches = number of spines, so adding a spine renumbers every uplink.
      - With more than 2 spines the leaf uplinks become Ethernet1-4 and the MLAG peer-link moves to Ethernet5-6; avdlab shifts
        server switch_ports that would collide (Ethernet3-6) up by the extra uplinks, so check the rendered CONNECTED_ENDPOINTS.
      doc_url: https://avd.arista.com/6.4/ansible_collections/arista/avd/roles/eos_designs/docs/tables/node-type-uplink-configuration.html
  - key: leaf_pairs
    type: int
    default: 2
    min: 1
    max: 8
    label: L3 leaf MLAG pairs
    help: Spine downlinks are extended beyond Ethernet1-8 automatically when more than 4 pairs are requested.
    learn:
      summary: Number of L3 leaf MLAG pairs. Each pair is one node_group with two nodes (MLAG is automatic) and its own BGP AS; leaf ids
        run 1..2N.
      avd_keys:
      - l3leaf.node_groups[].group
      - l3leaf.node_groups[].bgp_as
      - l3leaf.node_groups[].nodes[].id
      renders: mlag configuration / domain-id DC1_L3_LEAF<n>; router bgp <leaf_asn_base+n-1>; one P2P link per spine per leaf
      pitfalls:
      - Node ids index every pool — the loopback, VTEP and uplink pools must be large enough (a /27 loopback pool holds ids up to 31 minus
        the offset).
      - Spine downlinks (default_interfaces) are extended automatically past Ethernet8 for more than 4 pairs.
      doc_url: https://avd.arista.com/6.4/ansible_collections/arista/avd/roles/eos_designs/docs/tables/node-type-structure.html
  - key: l2leaf_per_pair
    type: int
    default: 1
    min: 0
    max: 2
    label: L2 leafs per pair
    help: 0 = none, 1 = single L2 leaf (<dc>-leaf<n>c), 2 = an MLAG pair of L2 leafs (c/d) sharing a node group.
    learn:
      summary: L2 leafs under each L3 leaf pair — 0 (none), 1 (dc1-leaf<n>c) or 2 (an MLAG pair c/d). L2 leafs are `l2leaf` nodes with port-channel
        uplinks to the pair.
      avd_keys:
      - l2leaf.node_groups[].uplink_switches
      - l2leaf.node_groups[].nodes
      - l2leaf.defaults.mlag_peer_ipv4_pool
      renders: interface Port-Channel1 (L2_DC1_L3_LEAF1_Port-Channel8) on the L2 leaf; interface Port-Channel8 … mlag 8 on the L3 leafs
      pitfalls:
      - L2 leafs are not underlay routers (no ip routing, no BGP); their trunk VLANs are computed from the VLANs they render.
      - With 2 per pair the L2 leafs form their own MLAG pair (Ethernet3-4 peer-link) and need their own mlag_peer_ipv4_pool.
      doc_url: https://avd.arista.com/6.4/ansible_collections/arista/avd/roles/eos_designs/docs/tables/node-type-l2-mlag-configuration.html
  - key: pools
    type: object
    value_type: pool
    default:
      loopback: 10.255.0.0/27
      vtep: 10.255.1.0/27
      uplink: 10.255.255.0/26
      mlag_peer: 10.255.1.64/27
      mlag_l3: 10.255.1.96/27
    label: IP pools
    help: loopback (Loopback0, spines then leafs), vtep (Loopback1), uplink (/31 P2P), mlag_peer (Vlan4094), mlag_l3 (Vlan4093).
    learn:
      summary: The IP pools AVD carves addresses from by node id — loopback (Loopback0 / router-id), vtep (Loopback1), uplink (/31 P2P links),
        mlag_peer (Vlan4094) and mlag_l3 (Vlan4093 + per-VRF peering SVIs).
      avd_keys:
      - <node_type>.defaults.loopback_ipv4_pool
      - l3leaf.defaults.vtep_loopback_ipv4_pool
      - l3leaf.defaults.uplink_ipv4_pool
      - l3leaf.defaults.mlag_peer_ipv4_pool
      - l3leaf.defaults.mlag_peer_l3_ipv4_pool
      renders: interface Loopback0 / ip address 10.255.0.3/32; interface Loopback1 / ip address 10.255.1.3/32; interface Ethernet1 / ip
        address 10.255.255.1/31; interface Vlan4094 / ip address 10.255.1.64/31; ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
      pitfalls:
      - Loopback0 = pool[id + loopback_ipv4_offset]; spines and leafs share the loopback pool, so the leaf offset (= spine count) keeps
        them apart.
      - MLAG pairs share ONE VTEP address (pool[primary id + offset]).
      - P2P subnet offset = (id - 1) × max_uplink_switches × max_parallel_uplinks + uplink index — size the uplink pool for the largest
        id.
      - Pools also feed PL-LOOPBACKS-EVPN-OVERLAY — a pool that does not cover the loopbacks stops them from being advertised and the overlay
        never comes up.
      doc_url: https://avd.arista.com/6.4/ansible_collections/arista/avd/roles/eos_designs/docs/tables/node-type-loopback-vtep-configuration.html
  - key: spine_asn
    type: int
    default: 65100
    label: Spine ASN
    learn:
      summary: BGP AS shared by all spines (eBGP underlay and overlay; the spines are EVPN route servers).
      avd_keys:
      - spine.defaults.bgp_as
      renders: router bgp 65100 on the spines; neighbor … remote-as 65100 on every leaf
      pitfalls:
      - Spines in one AS never peer with each other, and a route from one leaf is not reflected back to a leaf in the same AS — which is
        why every leaf pair has its own AS.
      doc_url: https://avd.arista.com/6.4/ansible_collections/arista/avd/roles/eos_designs/docs/tables/node-type-bgp-configuration.html
  - key: leaf_asn_base
    type: int
    default: 65101
    label: First leaf-pair ASN
    help: Pair n gets leaf_asn_base + n - 1.
    learn:
      summary: BGP AS of the first L3 leaf pair; pair n gets leaf_asn_base + n - 1. Both MLAG peers of a pair share the AS (set on the node_group).
      avd_keys:
      - l3leaf.node_groups[].bgp_as
      renders: router bgp 65101 on dc1-leaf1a/b, 65102 on dc1-leaf2a/b; neighbor MLAG-IPv4-UNDERLAY-PEER remote-as 65101
      pitfalls:
      - MLAG peers must share their AS — put bgp_as on the node_group, not on the nodes.
      - Use 4-byte private ASNs (4200000000+) for large fabrics; quote asdot values ("65000.100") in YAML.
      doc_url: https://avd.arista.com/6.4/ansible_collections/arista/avd/roles/eos_designs/docs/tables/node-type-bgp-configuration.html
  - key: serial_scheme
    type: string
    default: "{PREFIX}{ID:04d}"
    label: Serial-number scheme
    help: "Python format: PREFIX = upper(lab slug[:4]), ID = position in the inventory, HOST, TYPE, SLUG. Written to each node's serial_number and to the cEOS ceos-config file."
    learn:
      summary: Python format string for every node's serial number (PREFIX = first 4 characters of the lab slug, ID = position in the inventory;
        HOST, TYPE, SLUG also available). Written to `serial_number` and to the cEOS ceos-config file, so the container boots with that
        serial.
      avd_keys:
      - <node_type>.nodes[].serial_number
      renders: Nothing in the CLI; metadata.serial_number in the structured config, documentation and `SERIALNUMBER=` in clab/<node>/ceos-config
      pitfalls:
      - CloudVision and cv_deploy identify devices by serial number first — keep serials unique across labs that stream to the same CloudVision
        tenant.
      - Changing the scheme on an onboarded lab makes CloudVision see new devices.
      doc_url: https://avd.arista.com/6.4/ansible_collections/arista/avd/roles/eos_designs/docs/tables/node-type-common-configuration.html
  - key: tenants
    type: yaml
    default_from: "NETWORK_SERVICES:tenants"
    label: Tenants (network_services)
    help: Edited as YAML (`tenants:` list of the AVD network services data model); validated with pyavd.
    learn:
      summary: The network services — tenants with VRFs (L3VNI), SVIs (anycast gateways, L2VNI) and L2 VLANs, edited as the AVD `tenants:`
        YAML list and validated with pyavd.
      avd_keys:
      - tenants[].mac_vrf_vni_base
      - tenants[].vrfs[].vrf_vni
      - tenants[].vrfs[].svis[]
      - tenants[].l2vlans[]
      renders: vlan 11 / name VRF10_VLAN11; vrf instance VRF10; interface Vlan11 / ip address virtual 10.10.11.1/24; vxlan vlan 11 vni 10011;
        vxlan vrf VRF10 vni 10; router bgp … vlan 11 / rd 10.255.0.3:10011; vrf VRF10 / rd 10.255.0.3:10
      pitfalls:
      - SVIs render `shutdown` unless `enabled: true`.
      - L2VNI = mac_vrf_vni_base + VLAN id; RD/RT use the same number — keep it within 16 bits when the RD admin field is an IP.
      - '`ip_address_virtual` needs `virtual_router_mac_address` on the leafs (set by the generator).'
      - A VRF is only rendered on nodes where at least one of its SVIs matches the node's filter (tenants/tags).
      doc_url: https://avd.arista.com/6.4/ansible_collections/arista/avd/roles/eos_designs/docs/tables/network-services.html
  - key: servers
    type: yaml
    default_from: "CONNECTED_ENDPOINTS:servers"
    label: Servers (connected_endpoints)
    help: Edited as YAML (`servers:` list). Endpoints become linux containers in the containerlab topology.
    learn:
      summary: Connected endpoints (`servers:` list) — which switch ports each server uses, mode/VLANs and port-channel. They also become
        linux client containers in containerlab.
      avd_keys:
      - servers[].adapters[].switches
      - servers[].adapters[].switch_ports
      - servers[].adapters[].port_channel
      - servers[].adapters[].vlans
      renders: interface Ethernet5 / channel-group 5 mode active; interface Port-Channel5 / switchport trunk allowed vlan 11-12,21-22 /
        mlag 5 / spanning-tree portfast
      pitfalls:
      - switches, switch_ports and endpoint_ports are index-aligned lists of the same length.
      - Two switches of one MLAG pair + port_channel.mode → one MLAG port-channel (`mlag <id>`); two non-MLAG switches need an ethernet_segment
        (EVPN multihoming).
      - Endpoints only render on node types with connected_endpoints (l3leaf, l2leaf …), not on spines.
      doc_url: https://avd.arista.com/6.4/ansible_collections/arista/avd/roles/eos_designs/docs/tables/connected-endpoints.html
  - key: dns_servers
    type: yaml
    label: DNS servers
    default: [192.168.1.1]
    help: List of resolver IPs used by the switches (management VRF). Use public resolvers (1.1.1.1, 8.8.8.8) when the lab must reach CVaaS.
    learn:
      summary: Resolvers for the switches (in the management VRF).
      avd_keys:
      - dns_settings.servers[].ip_address
      renders: ip name-server vrf MGMT 192.168.1.1; ip domain lookup vrf MGMT source-interface Management1
      pitfalls:
      - CVaaS onboarding needs working DNS — use public resolvers (1.1.1.1, 8.8.8.8) or your own reachable from the management network.
      - The old top-level `name_servers` key was removed in AVD 6.0.
      doc_url: https://avd.arista.com/6.4/ansible_collections/arista/avd/roles/eos_designs/docs/tables/dns-settings.html
  - key: cloudvision
    type: object
    label: CloudVision
    default: {mode: none, region: auto, servers: [], disable_aaa: true, topology_hints: true, device_tags: {}}
    help: "mode: none | cvaas | onprem. cvaas → region (auto|us-central1-a|...); onprem → servers (IPs/hostnames, port 9910). device_tags: {label: value} applied to every device."
    learn:
      summary: Stream the lab to CloudVision — mode none | cvaas (region) | onprem (servers). Renders TerminAttr from `cv_settings` and
        CloudVision tags from `generate_cv_tags`.
      avd_keys:
      - cv_settings.cvaas.clusters[]
      - cv_settings.onprem_clusters[]
      - cv_settings.terminattr.disable_aaa
      - generate_cv_tags.topology_hints
      - generate_cv_tags.device_tags
      renders: daemon TerminAttr / exec /usr/bin/TerminAttr -cvaddr=apiserver.arista.io:443 -cvauth=token-secure,/tmp/cv-onboarding-token
        -cvvrf=MGMT -disableaaa …
      pitfalls:
      - AVD refuses cv_settings without ntp_settings.servers (and CVaaS without dns_settings.servers) — the lab adds pool.ntp.org / public
        DNS when the template has none.
      - The onboarding token is not in the config; it is written to /tmp/cv-onboarding-token (CVaaS) or /tmp/token (on-prem) by the onboarding
        job.
      - mode none removes the example's placeholder TerminAttr block.
      doc_url: https://avd.arista.com/6.4/ansible_collections/arista/avd/roles/eos_designs/docs/tables/cloudvision-settings.html
  - key: client_image
    type: string
    label: Client image
    help: "Docker image of the linux client containers (connected endpoints). Needs iperf3, iproute2 (bond/vlan) and ping. Empty = the server default (settings.host_image, ghcr.io/srl-labs/network-multitool:latest)."
    learn:
      summary: Docker image of the linux client containers that stand in for the connected endpoints (needs iperf3, iproute2 for bonds/VLANs,
        ping).
      avd_keys: []
      renders: 'Nothing in the switch configs; `kind: linux` nodes in clab/topology.clab.yml plus a generated setup script (bond, VLAN,
        IP)'
      pitfalls:
      - Empty = the server default (network-multitool). An image without iproute2 cannot build the LACP bond towards an MLAG pair.
      doc_url: https://containerlab.dev/manual/kinds/linux/
  - key: device_tags
    type: yaml
    default: {}
    label: Device tags (per device)
    help: "CloudVision device tags per device: {hostname: {label: value}}. Rendered into the node's structured_config.metadata.cv_tags.device_tags (merged after the global cloudvision.device_tags; a per-device label wins). Unknown hostnames are rejected."
    learn:
      summary: 'Per-device CloudVision tags {hostname: {label: value}} — rendered into the node''s structured_config.metadata.cv_tags.device_tags
        (a per-device label wins over the global cloudvision.device_tags).'
      avd_keys:
      - <node_type>.nodes[].structured_config.metadata.cv_tags.device_tags
      - generate_cv_tags.device_tags
      renders: Nothing in the CLI; tags pushed to CloudVision by cv_deploy (Inventory & Topology studio)
      pitfalls:
      - Unknown hostnames are rejected.
      - cv_deploy replaces tags with the same label but a different value; `cv_strict_tags` would remove all non-AVD tags.
      doc_url: https://avd.arista.com/6.4/ansible_collections/arista/avd/roles/eos_designs/docs/tables/cloudvision-tags.html
  - key: provisioning
    type: object
    label: Provisioning (startup-config / ZTP)
    default: {mode: startup-config, ztp_source: intended, ztp_server_ip: null}
    help: "mode: startup-config (containerlab mounts intended/configs) | ztp (cEOS boots into Zero Touch Provisioning: a `ztp` node runs dnsmasq + an HTTP server; option 67 serves <node>.cfg, or with ztp_source cloudvision a bootstrap script that runs the CloudVision target's ZTP script / writes the onboarding token). ztp_server_ip: empty = highest free IP of the management subnet."
    learn:
      summary: How switches get their first config — startup-config (containerlab mounts intended/configs) or ztp (cEOS boots into Zero
        Touch Provisioning from a dnsmasq + HTTP `ztp` container; option 67 points at <node>.cfg or a CloudVision bootstrap script).
      avd_keys: []
      renders: Nothing in the intended configs; a `ztp` node and clab/ztp/{dnsmasq.conf,run.sh,www/*} in the topology
      pitfalls:
      - In ztp mode the switches boot without config — Management0 DHCP must reach the ztp node; ZTP is cancelled by any startup-config.
      - ztp_source cloudvision needs a CloudVision target and onboarding token; secrets are written on the host, never into the lab repo.
      doc_url: https://containerlab.dev/manual/kinds/ceos/
  - key: segmentation
    type: yaml
    default: {}
    label: Segmentation (MSS foundation)
    help: "router segment-security: {enabled, applications: [{name, protocol: tcp|udp|icmp|any, ports}], policies: [{name, rules: [{application, action: forward|drop, log}]}], vrfs: [{name, segments: [{name, prefixes: [cidr], interfaces: [], policies: [{from, policy}], fallback: forward|drop}]}]}. Rendered only on the L3 leafs that carry each VRF (node structured_config). Foundation — MSS design to be refined."
    learn:
      summary: Multi-domain segmentation (MSS foundation) — applications, policies and per-VRF segments rendered as `router segment-security`
        on the L3 leafs that carry each VRF.
      avd_keys:
      - <node_type>.nodes[].structured_config.router_segment_security
      - <node_type>.nodes[].structured_config.application_traffic_recognition
      - <node_type>.nodes[].structured_config.match_list_input
      renders: router segment-security / vrf VRF10 / segment APP / definition / match prefix-ipv4 MSS-VRF10-APP / policies / from DB policy
        P-WEB / fallback policy policy-drop-all
      pitfalls:
      - Policies are stateless on cEOS — return traffic is governed by the reverse segment pair.
      - A policy with no matching rule drops; `fallback` decides for sources without an explicit `from`.
      - Rendered through node structured_config — a hand-written node structured_config at the same level would be replaced, not merged
        (only the most specific level is used).
      doc_url: https://avd.arista.com/6.4/ansible_collections/arista/avd/roles/eos_cli_config_gen/docs/tables/router-segment-security.html
  - key: act
    type: object
    label: Arista Cloud Test (ACT)
    default: {os_version: 4.33.1F, username: cvpadmin, password: "cvp123!", internet_access: true, tools_server_ip: ""}
    help: "Used when the lab target is act: the build runs pyavd in digital-twin mode (vEOS-lab, Management1) and writes the ACT topology (documentation/fabric/<fabric>-topology.yml) with a tools server (tools_server_ip in the mgmt subnet; empty = highest free address) and one ubuntu node per client. username/password are the ACT node credentials (also added as a local user so deploy keeps access)."
    learn:
      summary: Arista Cloud Test (ACT) settings, used when the lab target is act — pyavd builds in digital-twin mode (vEOS-lab, Management1)
        and writes the ACT topology file with a tools server and one ubuntu node per client.
      avd_keys:
      - digital_twin.fabric.act_os_version
      - digital_twin.fabric.act_username
      - digital_twin.fabric.act_password
      - digital_twin.fabric.act_internet_access
      - avd_digital_twin_mode
      renders: documentation/fabric/<fabric>-topology.yml (ACT topology); the configs use platform vEOS-lab settings
      pitfalls:
      - Digital twin is PREVIEW in AVD 6.4; mgmt_ip: dhcp is refused in twin mode.
      - username/password are the ACT node credentials — they are also added as a local user so deploy keeps access.
      doc_url: https://avd.arista.com/6.4/ansible_collections/arista/avd/roles/eos_designs/docs/tables/digital-twin-configuration.html
