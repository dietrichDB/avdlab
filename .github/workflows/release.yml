# avdlab release: on a tag v<version> run the tests, build + push ghcr.io/<owner>/avdlab:<version> and :latest
# (linux/amd64 + linux/arm64), and create the GitHub Release with a source tarball and the CHANGELOG section.
# Instances with AVDLAB_UPDATE_SOURCE=github:<owner>/<repo> see the release in the update panel; with
# AVDLAB_UPDATE_MODE=image they pull ghcr.io/<owner>/avdlab:<version> (the image name the update check derives).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - run: npm test
      - run: npm run build

  release:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          file_version="$(tr -d '[:space:]' < VERSION)"
          if [ "$version" != "$file_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION ($file_version)"; exit 1
          fi
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$owner/avdlab" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Changelog section
        run: |
          awk -v v="${{ steps.v.outputs.version }}" '
            $0 ~ "^## \\[?" v "\\]?([ ]|$)" {on=1; next}
            on && /^## / {exit}
            on && /^\[[^]]+\]: / {exit}
            on {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "Release ${{ steps.v.outputs.version }}" > release-notes.md; fi
          cat release-notes.md

      - name: Source tarball
        run: |
          git archive --format=tar.gz --prefix="avdlab-${{ steps.v.outputs.version }}/" \
            -o "avdlab-${{ steps.v.outputs.version }}.tar.gz" HEAD

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:latest
          build-args: |
            AVDLAB_GIT_SHA=${{ steps.v.outputs.sha }}
            AVDLAB_BUILD_DATE=${{ steps.v.outputs.date }}
          labels: |
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" "avdlab-${{ steps.v.outputs.version }}.tar.gz" \
            --title "avdlab ${{ steps.v.outputs.version }}" --notes-file release-notes.md \
            $(case "${{ steps.v.outputs.version }}" in *-*) echo --prerelease;; esac)
