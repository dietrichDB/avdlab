[project]
name = "avdlab"
version = "1.0.5"
description = "AVD Lab Orchestrator — web app to provision hosts, build AVD labs, deploy with containerlab/ACT, validate with ANTA"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "cryptography>=42",
  "itsdangerous>=2.2",
  "python-multipart>=0.0.9",
  "asyncssh>=2.14",
  "pyyaml>=6.0",
  "gitpython>=3.1",
  "httpx>=0.27",
  "pyavd[ansible]==6.4.0",
  "anta==1.10.0",
  "eos-downloader>=0.13",
  "typer>=0.12",
  "pynetbox>=7.8",  # 7.8: NetBox 4.5 v2 tokens (nbt_<id>.<secret> → Bearer)
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "aiosmtplib>=3.0",
  "qrcode>=7.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]


[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["avdlab*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
